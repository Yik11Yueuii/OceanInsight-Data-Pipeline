spark.master                     local[4]
spark.driver.memory              2g
spark.executor.memory            2g
spark.default.parallelism        4
spark.sql.shuffle.partitions     8
spark.sql.adaptive.enabled       true
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.local.dir                  /data/oceaninsight/spark/local
spark.sql.warehouse.dir          hdfs://localhost:9000/oceaninsight/warehouse
spark.ui.enabled                 false
spark.sql.catalogImplementation              hive
spark.sql.hive.metastore.version             4.0.1
spark.sql.hive.metastore.jars                path
spark.sql.hive.metastore.jars.path           file:///opt/hive/lib/*
